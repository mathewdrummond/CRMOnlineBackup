# Replace the example hostnames and filesystem paths before use.
# This config assumes:
# - the API runs locally on 127.0.0.1:4000
# - CRM static files are built into /opt/joinerflow/client/dist
# - optional time clock static files are built into /opt/joinerflow/clock-client/dist

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=joinerflow_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=joinerflow_api:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name crm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.example.com;

    ssl_certificate /etc/letsencrypt/live/crm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:JoinerFlowSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    root /opt/joinerflow/client/dist;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://accounts.google.com/gsi/client https://accounts.google.com; connect-src 'self' https://accounts.google.com/gsi/; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; frame-src https://accounts.google.com; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/auth/google {
        limit_req zone=joinerflow_auth burst=20 nodelay;
        include /etc/nginx/snippets/joinerflow-proxy.conf;
        proxy_pass http://127.0.0.1:4000;
    }

    location /api/ {
        limit_req zone=joinerflow_api burst=180 nodelay;
        include /etc/nginx/snippets/joinerflow-proxy.conf;
        proxy_pass http://127.0.0.1:4000;
    }

    location /filesystem/ {
        include /etc/nginx/snippets/joinerflow-proxy.conf;
        proxy_pass http://127.0.0.1:4000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Optional standalone time clock host.
# Keep this internal/LAN-only unless you have a strong reason to publish it.
server {
    listen 80;
    listen [::]:80;
    server_name clock.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clock.example.com;

    ssl_certificate /etc/letsencrypt/live/clock.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clock.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:JoinerFlowClockSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    root /opt/joinerflow/clock-client/dist;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; connect-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        limit_req zone=joinerflow_api burst=180 nodelay;
        include /etc/nginx/snippets/joinerflow-proxy.conf;
        proxy_pass http://127.0.0.1:4000;
    }

    location /filesystem/ {
        include /etc/nginx/snippets/joinerflow-proxy.conf;
        proxy_pass http://127.0.0.1:4000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
