name: ${JOINERFLOW_PROJECT_NAME:-joinerflow}

services:
  joinerflow-server:
    container_name: joinerflow-server
    build:
      context: ../../..
      dockerfile: deployment/synology/docker/Dockerfile.server
    restart: unless-stopped
    env_file:
      - ../env/.env.production
      - ../env/.env.ai
    environment:
      TZ: ${TZ:-Pacific/Auckland}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ai.millbrook:11434}
      DATABASE_DRIVER: ${DATABASE_DRIVER:-sqlite}
      DATABASE_SHADOW_WRITE: ${DATABASE_SHADOW_WRITE:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql://joinerflow:${POSTGRES_PASSWORD:-joinerflow}@postgres:5432/joinerflow}
      QDRANT_URL: ${QDRANT_URL:-http://ai.millbrook:6333}
      QDRANT_COLLECTION_ENTITIES: ${QDRANT_COLLECTION_ENTITIES:-entity_embeddings}
      QDRANT_COLLECTION_KNOWLEDGE: ${QDRANT_COLLECTION_KNOWLEDGE:-knowledge_chunks}
      QDRANT_REQUEST_TIMEOUT_MS: ${QDRANT_REQUEST_TIMEOUT_MS:-3000}
      SQLITE_PATH: ${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/server/joinerflow.sqlite
      FILESYSTEM_ROOT: ${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/filesystem
      BACKUP_ROOT: ${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/backups
      LOG_DIRECTORY: ${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/logs
    user: "${JOINERFLOW_PUID:-1026}:${JOINERFLOW_PGID:-100}"
    volumes:
      - /volume1:/volume1:ro
      - ${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/server:${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/server
      - ${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/filesystem:${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/filesystem
      - ${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/backups:${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/backups
      - ${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/logs:${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/logs
      - ${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/imports:${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/imports
      - ${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/temp:${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/temp
      - ${JOINERFLOW_ARCHIVE_ROOT:-/volume1/archive}:${JOINERFLOW_ARCHIVE_ROOT:-/volume1/archive}:ro
    networks:
      - joinerflow-internal
    ports:
      - "127.0.0.1:${JOINERFLOW_SERVER_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /run:size=16m
    deploy:
      resources:
        limits:
          memory: 1200M
          pids: 256
        reservations:
          memory: 512M
    pids_limit: 256

  postgres:
    container_name: joinerflow-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Pacific/Auckland}
      POSTGRES_DB: ${PGDATABASE:-joinerflow}
      POSTGRES_USER: ${PGUSER:-joinerflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-joinerflow}
    expose:
      - "5432"
    ports:
      - "127.0.0.1:${JOINERFLOW_POSTGRES_PORT:-5432}:5432"
    volumes:
      - /volume1/docker/postgres:/var/lib/postgresql/data
    networks:
      - joinerflow-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-joinerflow} -d ${PGDATABASE:-joinerflow} -h 127.0.0.1 -p 5432"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
          pids: 256
        reservations:
          memory: 256M
    pids_limit: 256

  qdrant:
    container_name: joinerflow-qdrant
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Pacific/Auckland}
      QDRANT__SERVICE__GRPC_PORT: 6334
    expose:
      - "6333"
      - "6334"
    ports:
      - "127.0.0.1:${JOINERFLOW_QDRANT_PORT:-6333}:6333"
    volumes:
      - /volume1/vector-data/qdrant:/qdrant/storage
    networks:
      - joinerflow-internal
    healthcheck:
      test: ["CMD-SHELL", 'bash -ec "exec 3<>/dev/tcp/127.0.0.1/6333; echo -en \"GET /healthz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n\" >&3; read -r status <&3; [[ \$$status == *200* ]]"']
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1024M
          pids: 256
        reservations:
          memory: 384M
    pids_limit: 256

  joinerflow-client:
    container_name: joinerflow-client
    build:
      context: ../../..
      dockerfile: deployment/synology/docker/Dockerfile.client
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Pacific/Auckland}
    networks:
      - joinerflow-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=32m
    deploy:
      resources:
        limits:
          memory: 192M

  joinerflow-clock-client:
    container_name: joinerflow-clock-client
    build:
      context: ../../..
      dockerfile: deployment/synology/docker/Dockerfile.clock-client
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Pacific/Auckland}
    networks:
      - joinerflow-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=32m
    deploy:
      resources:
        limits:
          memory: 192M

  ollama:
    container_name: ollama
    image: ollama/ollama:0.22.1
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Pacific/Auckland}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_HOST: 0.0.0.0
    networks:
      - joinerflow-internal
    ports:
      - "127.0.0.1:${JOINERFLOW_OLLAMA_PORT:-11434}:11434"
    expose:
      - "11434"
    volumes:
      - ${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/ai/models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", 'bash -ec "exec 3<>/dev/tcp/127.0.0.1/11434; echo -en \"GET /api/tags HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n\" >&3; read -r status <&3; [[ \$$status == *200* ]]"']
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 10240M
          pids: 256
        reservations:
          memory: 2048M
    pids_limit: 256

  caddy:
    container_name: joinerflow-proxy
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Pacific/Auckland}
      JOINERFLOW_PUBLIC_HOST: ${JOINERFLOW_PUBLIC_HOST:-joinerflow.local}
      TIMECLOCK_KIOSK_KEY: ${TIMECLOCK_KIOSK_KEY:-}
    ports:
      - "${JOINERFLOW_PROXY_HTTP_PORT:-80}:80"
      - "${JOINERFLOW_PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/diagnostics/caddy/data:/data
      - ${JOINERFLOW_INSTALL_ROOT:-/volume1/joinerflow}/diagnostics/caddy/config:/config
    networks:
      - joinerflow-internal
    depends_on:
      joinerflow-server:
        condition: service_healthy
      joinerflow-client:
        condition: service_healthy
      joinerflow-clock-client:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --header=\"Host: $${JOINERFLOW_PUBLIC_HOST:-joinerflow.local}\" http://127.0.0.1:80/caddy-health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=32m
    deploy:
      resources:
        limits:
          memory: 192M

networks:
  joinerflow-internal:
    name: joinerflow-internal
    driver: bridge
